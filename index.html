<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGIKA'S FATED ASCENSION</title>
    <meta name="description" content="MAGIKA'S is an independent music group and creative studio bringing together artists, producers, vocalists, music videos, and original projects.">
    <meta name="keywords" content="MAGIKA'S, independent music group, music collective, artists, producers, vocalists, music videos, creative studio, original music">
    <meta name="theme-color" content="#f6f1fc">
    <meta name="color-scheme" content="light dark">
    <meta property="og:title" content="MAGIKA'S FATED ASCENSION">
    <meta property="og:description" content="Discover MAGIKA'S FATED ASCENSION, an independent music group and creative studio for artists, producers, vocalists, and original music projects.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="google-site-verification" content="FuxK1b4pfJgGLYuCleQazm3yBsPvnb7zjMOETREsdWU" />
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/BURGER.png">
</head>
<body>
    <main class="launch-page">
        <div class="launch-brand">
            <img src="images/BURGER.png" alt="MAGIKA'S logo" class="dnd-image">
            <h1 class="ibm-plex-mono-bold">MAGIKA'S FATED ASCENSION</h1>
            <p class="launch-label ibm-plex-mono-semibold">WEBSITE IN CONSTRUCTION</p>
        </div>
        <section class="countdown-panel" aria-labelledby="countdown-heading">
            <h2 id="countdown-heading" class="ibm-plex-mono-semibold">SEPTEMBER 15 / 12:00 AM PST</h2>
            <div class="countdown" aria-label="Countdown to September 15, 2026 at midnight Pacific Time">
                <div><strong id="countdown-days">00</strong><span>DAYS</span></div>
                <div><strong id="countdown-hours">00</strong><span>HOURS</span></div>
                <div><strong id="countdown-minutes">00</strong><span>MINUTES</span></div>
                <div><strong id="countdown-seconds">00</strong><span>SECONDS</span></div>
            </div>
            <button class="launch-access-link" type="button" aria-controls="launch-modal" aria-expanded="false">Have access? Enter code here.</button>
        </section>
    </main>
    <div class="access-modal" id="launch-modal" hidden>
        <div class="access-dialog" role="dialog" aria-modal="true" aria-labelledby="launch-access-heading">
            <button class="access-close" type="button" aria-label="Close access dialog">&times;</button>
            <p class="feature-eyebrow">PRIVATE ACCESS</p>
            <h2 id="launch-access-heading">ENTER ACCESS CODE</h2>
            <form class="access-form">
                <label for="launch-access-code">CODE</label>
                <input id="launch-access-code" type="password" autocomplete="off" required>
                <p class="access-error" role="alert" aria-live="polite"></p>
                <button class="access-submit" type="submit">UNLOCK</button>
            </form>
        </div>
    </div>
    <script src="site.js"></script>
</body>
</html>
